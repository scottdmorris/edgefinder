name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # The project is developed and its jobs run on Windows, so that is what is tested.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
